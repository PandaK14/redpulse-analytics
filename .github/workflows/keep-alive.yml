name: Keep API awake

# Render's free tier sleeps after 15 minutes without traffic. Ping /health
# well inside that window so the dashboard never hits a cold start.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 10 https://redpulse-analytics-api-cicv.onrender.com/health
